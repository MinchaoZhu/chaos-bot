name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Require version bump for pushes
        if: ${{ github.event_name == 'push' }}
        run: bash scripts/release/validate-version-sync.sh --require-change "${{ github.event.before }}"

      - name: Validate release version sync
        run: make release-check

      - name: Run full test gate
        env:
          CHAOS_BOT_KEEP_TMP_ON_FAIL: "1"
        run: make test-all

      - name: Upload failure artifacts (runtime logs/config/playwright)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: chaos-bot-failure-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/unit
            .tmp/integration
            .tmp/e2e/runtime
            .tmp/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Verify Linux package assembly
        run: |
          make package-verify
          make upgrade-verify

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release metadata
        id: version
        run: |
          mkdir -p .tmp/release
          bash scripts/release/validate-version-sync.sh
          bash scripts/release/generate-release-metadata.sh .tmp/release > .tmp/release/outputs.txt
          cat .tmp/release/outputs.txt >> "${GITHUB_OUTPUT}"
          bash scripts/release/version.sh >> "${GITHUB_OUTPUT}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Build release package
        id: package
        run: |
          mkdir -p .tmp/release
          bash scripts/release/package-linux-x86_64.sh .tmp/release > .tmp/release/package-outputs.txt
          cat .tmp/release/package-outputs.txt >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_version }}
          body_path: ${{ steps.version.outputs.notes_path }}
          files: |
            ${{ steps.version.outputs.metadata_path }}
            ${{ steps.version.outputs.checksum_path }}
            ${{ steps.package.outputs.bundle_path }}
            ${{ steps.package.outputs.bundle_checksum_path }}
            ${{ steps.package.outputs.bundle_manifest_path }}
